# Alt-centered tmux configuration
# - No prefix key: Alt is the modifier for the most common actions
# - Less common actions go through one-shot key tables, used like a prefix: Alt-p pane, Alt-t tab (window),
#   Alt-r resize, Alt-m move, then one key. Resizing, moving and switching tabs repeat: keep pressing h/j/k/l without
#   re-entering the table. The status bar shows the table while it's active.
# - Alt-s opens the pane's scrollback in Neovim (copy mode, with tmux's vi defaults, is still on the mouse wheel)
# - Alt-h/j/k/l move between tmux panes and Neovim splits alike (vim-tmux-navigator), Alt-o goes back to the
#   previous one
# - Alt-g locks tmux (all keys go to the pane) until Alt-g is pressed again

set -g prefix None
unbind C-b

set -g renumber-windows on
set -as terminal-features ',xterm-kitty:RGB'
set -g allow-passthrough on # lets kitty graphics (e.g. yazi image previews) through

# Emphasize the focused pane with a lighter background than the rest (the theme's base01 vs base00). Neovim leaves its
# focused split transparent and gives unfocused splits the same colour as unfocused panes, so focus reads the same
# across panes and splits.
# (window-active-style needs an explicit colour: 'default' there means "same as window-style", not the terminal's)
set -g window-style 'bg=@inactive_background@'
set -g window-active-style 'bg=@active_background@'

# Status bar: just the window (tab) names, the current one highlighted by the theme, plus the active mode (pane, tab,
# resize, move, locked) on the left while in one
set -g status-left '#{?#{!=:#{client_key_table},root},#[reverse] #{client_key_table} #[noreverse] ,}'
set -g status-right ''
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '
set -g window-status-separator ''

# Same border colour around every pane, rather than highlighting the focused pane's side of each border
set -gF pane-active-border-style '#{pane-border-style}'

# ---------------------------------------------------------------------------------------------------------------------
# Navigation shared with Neovim (vim-tmux-navigator): when Neovim runs in the pane, pass the key on so it can move
# between its splits, and back out to tmux at the edges
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^ *[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?)(diff)?(-wrapped)?$'"
# Focus stops at the window's edges instead of wrapping around
bind -n M-h if-shell "$is_vim" 'send-keys M-h' "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind -n M-j if-shell "$is_vim" 'send-keys M-j' "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n M-k if-shell "$is_vim" 'send-keys M-k' "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind -n M-l if-shell "$is_vim" 'send-keys M-l' "if -F '#{pane_at_right}' '' 'select-pane -R'"
bind -n M-o if-shell "$is_vim" 'send-keys M-o' 'last-pane'

# ---------------------------------------------------------------------------------------------------------------------
# Root bindings
bind -n M-d detach-client
bind -n M-p switch-client -T pane
bind -n M-r switch-client -T resize
bind -n M-t switch-client -T tab
bind -n M-s display-popup -E -w 95% -h 95% '@edit_scrollback@'
bind -n M-m switch-client -T move
bind -n M-g set key-table locked
# New pane, split along the pane's longer side (cells are about twice as tall as they are wide)
bind -n M-n if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' \
  'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ---------------------------------------------------------------------------------------------------------------------
# Locked: only Alt-g is handled by tmux, every other key goes to the pane
bind -T locked M-g set key-table root

# ---------------------------------------------------------------------------------------------------------------------
# Pane (Alt-p): h/j/k/l split in that direction, n split along the longer side, p last pane, x close, f fullscreen
bind -T pane h split-window -hb -c '#{pane_current_path}'
bind -T pane j split-window -v -c '#{pane_current_path}'
bind -T pane k split-window -vb -c '#{pane_current_path}'
bind -T pane l split-window -h -c '#{pane_current_path}'
bind -T pane n if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' \
  'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -T pane p last-pane
bind -T pane x kill-pane
bind -T pane f resize-pane -Z

# ---------------------------------------------------------------------------------------------------------------------
# Tab (Alt-t): h/l previous/next (repeat), n new, x close, s sync panes, Tab last tab
bind -r -T tab h previous-window
bind -r -T tab l next-window
bind -T tab n new-window -c '#{pane_current_path}'
bind -T tab x kill-window
bind -T tab s set -w synchronize-panes
bind -T tab Tab last-window

# ---------------------------------------------------------------------------------------------------------------------
# Resize (Alt-r): h/j/k/l move the pane's border in that direction (repeat)
bind -r -T resize h resize-pane -L 4
bind -r -T resize j resize-pane -D 2
bind -r -T resize k resize-pane -U 2
bind -r -T resize l resize-pane -R 4

# ---------------------------------------------------------------------------------------------------------------------
# Move (Alt-m): h/j/k/l swap the pane with its neighbour in that direction, keeping focus on it (repeat)
bind -r -T move h swap-pane -d -t '{left-of}'
bind -r -T move j swap-pane -d -t '{down-of}'
bind -r -T move k swap-pane -d -t '{up-of}'
bind -r -T move l swap-pane -d -t '{right-of}'

# ---------------------------------------------------------------------------------------------------------------------
# Copy mode: tmux's vi defaults, plus Alt-h/j/k/l/o to change focus
bind -T copy-mode-vi M-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi M-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi M-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi M-l if -F '#{pane_at_right}' '' 'select-pane -R'
bind -T copy-mode-vi M-o last-pane
